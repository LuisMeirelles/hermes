name: hermes-staging

services:
  db:
    image: postgres:18-alpine3.22
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: luismeirelles/hermes:staging
    build:
      context: .
      dockerfile: .docker/app/Dockerfile.prod
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "80"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      traefik.enable: "true"
      traefik.http.routers.hermes-staging.rule: "Host(`staging.hermes.meirelles.dev`)"
      traefik.http.routers.hermes-staging.entrypoints: "websecure"
      traefik.http.routers.hermes-staging.tls.certresolver: "letsencrypt"
      traefik.http.services.hermes-staging.loadbalancer.server.port: 80
      traefik.http.routers.hermes-staging.middlewares: "SslHeader@file"
      traefik.http.routers.hermes-staging.tls: "true"
    networks:
      - default
      - proxy

  queue:
    image: luismeirelles/hermes:staging
    build:
      context: .
      dockerfile: .docker/app/Dockerfile.prod
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["NONE"]
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600

  scheduler:
    image: luismeirelles/hermes:staging
    build:
      context: .
      dockerfile: .docker/app/Dockerfile.prod
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["NONE"]
    command: php artisan schedule:work

  migrate:
    image: luismeirelles/hermes:staging
    build:
      context: .
      dockerfile: .docker/app/Dockerfile.prod
    restart: "no"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["NONE"]
    command: php artisan migrate --force

volumes:
  db_data:

networks:
  proxy:
    external: true
